version: "3.9"

services:
  portfolio:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ameerali-portfolio:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.local          # all runtime secrets loaded from here
    environment:
      NODE_ENV: production
    restart: unless-stopped
